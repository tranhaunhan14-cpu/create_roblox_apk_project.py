name: Build Roblox Translator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bung dự án Android từ file Python
        run: python3 create_roblox_apk_project.py

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cài đặt Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Biên dịch ra file APK
        working-directory: RobloxTranslatorAPK
        run: gradle assembleDebug --no-daemon

      - name: Xuất file APK để tải về điện thoại
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Screen-Translator-APK
          path: RobloxTranslatorAPK/app/build/outputs/apk/debug/app-debug.apk
